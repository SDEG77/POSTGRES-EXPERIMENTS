name: Docker & DB Migration CI Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build containers (clean build)
      - name: Build Docker Compose
        run: docker compose build --no-cache

      # 4. Start services
      - name: Start services
        run: docker compose up -d --build

      # 5. Wait for Postgres (reliable check)
      - name: Wait for Postgres readiness
        run: |
          echo "Waiting for PostgreSQL..."
          until docker compose exec -T postgres pg_isready -U postgres; do
            echo "Postgres not ready yet..."
            sleep 2
          done

      # 6. Check containers
      - name: Check containers
        run: docker ps

      # 7. Run migrations (FIXED - no npm script dependency)
      - name: Run migrations
        run: docker compose run --rm express npx node-pg-migrate up

      # 8. Verify migration worked
      - name: Verify DB schema
        run: |
          docker compose exec -T postgres psql -U postgres -d pg-tutorial -c "\dt"

      # 9. Health check API
      - name: Test API
        run: curl --fail http://localhost:3000 || exit 1

      # 10. Cleanup
      - name: Shutdown
        run: docker compose down -v